[package]
name = "gemini-webapi-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `src/gemini_webapi/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures = "0.3.34"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
rand = "0.10.4"
regex = "1.13.2"
reqwest = { version = "0.12", features = ["rustls-tls", "cookies", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["time"] }
tracing = "0.1"
uuid = { version = "1.29.3", features = ["v4"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
