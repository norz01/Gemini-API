[package]
name = "cli-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `cli.py`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
gemini-webapi-rs = { path = "../gemini-webapi-rs" }
futures = "0.3.34"
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
