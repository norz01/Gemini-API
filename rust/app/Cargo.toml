[package]
name = "cli"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `cli`, generated by rust-anything: Rust owns the entry point, the original answers what is not ported yet"

[[bin]]
name = "cli"
path = "src/main.rs"

[dependencies]
clap = "4"
gemini-webapi-rs = { path = "../gemini-webapi-rs" }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"

[workspace]
