[package]
name = "cli"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `cli`, generated by rust-anything: Rust owns the entry point, the original answers what is not ported yet"

[[bin]]
name = "cli"
path = "src/main.rs"

[dependencies]
clap = "4"
gemini-webapi-rs = { path = "../gemini-webapi-rs" }
cli-rs = { path = "../cli-rs" }
serde_json = "1"

[workspace]
